<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Community Connect SA | Enquiry</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<header>

    <nav class="navbar">

        <a href="index.html" class="logo">
            Community Connect SA
        </a>

        <ul class="nav-links">

            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="services.html">Opportunities</a></li>
            <li><a href="enquiry.html">Enquiry</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="faq.html">FAQ</a></li>

        </ul>

    </nav>

</header>


<main>

    <section class="page-header">

        <h1>Make an Enquiry</h1>

        <p>
            Complete the form and we will get
            back to you as soon as possible.
        </p>

    </section>


    <section class="form-section">

        <form id="enquiryForm">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                required
            >


            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >


            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
            >


            <label for="type">
                Enquiry Type
            </label>

            <select id="type" name="type">

                <option>
                    Volunteer Opportunity
                </option>

                <option>
                    Sponsorship
                </option>

                <option>
                    Organisation Partnership
                </option>

                <option>
                    General Enquiry
                </option>

            </select>


            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                name="message"
                rows="6"
                required>
            </textarea>


            <button type="submit"
                    class="btn">
                Submit Enquiry
            </button>

        </form>

    </section>

</main>


<footer>

    <div class="copyright">
        &copy; 2026 Community Connect SA.
        All rights reserved.
    </div>

</footer>


<script src="js/script.js"></script>

</body>

</html>
